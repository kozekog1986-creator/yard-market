{% extends 'base.html' %}{% block content %}<section class="form-page"><div class="eyebrow">ПУБЛИКАЦИЯ</div><h1>{{ 'Редактировать объявление' if item else 'Новое объявление' }}</h1><p class="muted">Опишите товар честно и не публикуйте запрещённые товары.</p><form method="post" class="stack"><label>Название<input name="title" required maxlength="100" value="{{ item.title if item else '' }}" placeholder="Например, беспроводные наушники"></label><label>Категория<select name="category" required>{% for c in categories %}<option value="{{ c }}" {% if item and item.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Цена, ₽<input type="number" name="price" min="0" max="100000000" required value="{{ item.price if item else '' }}"></label><label>Город или район<input name="location" maxlength="80" value="{{ item.location if item else '' }}" placeholder="Необязательно"></label><label>Описание<textarea name="description" required maxlength="3000" rows="7" placeholder="Состояние, характеристики, условия передачи…">{{ item.description if item else '' }}</textarea></label><button class="primary">{{ 'Сохранить изменения' if item else 'Опубликовать' }}</button></form></section>{% endblock %}
